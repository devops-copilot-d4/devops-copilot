apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-checkout-service
  namespace: devops-copilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-checkout-service
  template:
    metadata:
      labels:
        app: demo-checkout-service
    spec:
      containers:
        - name: checkout-api
          image: tharungowda/demo-checkout-service:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_SECRET
              valueFrom:
                secretKeyRef:
                  name: non-existent-database-secret
                  key: password
