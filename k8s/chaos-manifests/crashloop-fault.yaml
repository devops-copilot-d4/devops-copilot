apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-checkout-service
  namespace: devops-copilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-checkout-service
  template:
    metadata:
      labels:
        app: demo-checkout-service
    spec:
      containers:
        - name: checkout-api
          image: tharungowda/demo-checkout-service:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo '[FATAL] Missing DB credentials! Application crashing...' && exit 1"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
