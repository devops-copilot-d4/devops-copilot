apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-checkout-service
  namespace: devops-copilot
  labels:
    app: demo-checkout-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-checkout-service
  template:
    metadata:
      labels:
        app: demo-checkout-service
    spec:
      containers:
        - name: checkout-api
          image: tharungowda/demo-checkout-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-checkout-service
  namespace: devops-copilot
spec:
  type: ClusterIP
  selector:
    app: demo-checkout-service
  ports:
    - port: 80
      targetPort: 3000
