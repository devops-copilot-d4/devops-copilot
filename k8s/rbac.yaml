apiVersion: v1
kind: Namespace
metadata:
  name: devops-copilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-copilot-sa
  namespace: devops-copilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-copilot-role
  namespace: devops-copilot
rules:
  # Pod inspection and restart
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Deployment inspection, scaling, and rolling restart/rollback
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "deployments/rollback", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-copilot-rb
  namespace: devops-copilot
subjects:
  - kind: ServiceAccount
    name: devops-copilot-sa
    namespace: devops-copilot
roleRef:
  kind: Role
  name: devops-copilot-role
  apiGroup: rbac.authorization.k8s.io
