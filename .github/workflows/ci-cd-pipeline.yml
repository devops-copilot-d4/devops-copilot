name: AI DevOps Copilot - CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # JOB 1: Test & Lint Backend, Frontend, and AI Service
  # -------------------------------------------------------------
  test-and-validate:
    name: Test & Validate Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Node.js Backend Tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies & Run Safety Tests
        run: |
          cd backend
          npm ci || npm install
          node tests/safety.test.js
          node tests/aiClient.test.js
          node tests/k8sRecovery.test.js

      # 2. Python AI Service Tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI Service Dependencies & Validate ML Pipeline
        run: |
          cd ai-service
          pip install -r requirements.txt
          cd ../ml
          python evaluate.py

      # 3. Validate Kubernetes Manifests
      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f k8s/rbac.yaml
          kubectl apply --dry-run=client -f k8s/app-deployment.yaml

  # -------------------------------------------------------------
  # JOB 2: Build and Package Container Images
  # -------------------------------------------------------------
  build-and-package:
    name: Build & Package Containers
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Demo Microservice Container
        uses: docker/build-push-action@v5
        with:
          context: ./sample-app
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'tharungowda' }}/demo-checkout-service:latest

      - name: Build AI Service Container
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'tharungowda' }}/devops-copilot-ai:latest
