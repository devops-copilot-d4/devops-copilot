name: AI DevOps Copilot CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'tharungowda' }}

jobs:
  test-and-validate:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend dependencies and tests
        run: |
          cd backend
          npm ci || npm install
          npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: AI service and ML pipeline tests
        run: |
          cd ai-service
          pip install -r requirements.txt
          pytest tests/ -q
          cd ../ml
          pytest tests/ -q

      - name: Frontend install and production build
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f k8s/rbac.yaml
          kubectl apply --dry-run=client -f k8s/app-deployment.yaml

  build-and-push:
    name: Build & Push Images (commit-SHA tags)
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute immutable image tag
        id: image-tag
        run: echo "sha=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_USERNAME }}/devops-copilot-backend:${{ steps.image-tag.outputs.sha }}
            docker.io/${{ env.DOCKERHUB_USERNAME }}/devops-copilot-backend:latest

      - name: Build and push AI service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ai-service/Dockerfile
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_USERNAME }}/devops-copilot-ai:${{ steps.image-tag.outputs.sha }}
            docker.io/${{ env.DOCKERHUB_USERNAME }}/devops-copilot-ai:latest

      - name: Build and push sample app image
        uses: docker/build-push-action@v5
        with:
          context: ./sample-app
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_USERNAME }}/demo-checkout-service:${{ steps.image-tag.outputs.sha }}
            docker.io/${{ env.DOCKERHUB_USERNAME }}/demo-checkout-service:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_USERNAME }}/devops-copilot-frontend:${{ steps.image-tag.outputs.sha }}
            docker.io/${{ env.DOCKERHUB_USERNAME }}/devops-copilot-frontend:latest

  deploy:
    name: Deploy to Kubernetes & Verify Rollout
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::Kubernetes credentials not provided. Set KUBE_CONFIG secret."
            exit 1
          fi
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply RBAC and namespace
        run: kubectl apply -f k8s/rbac.yaml --server-side

      - name: Apply deployment manifest
        run: kubectl apply -f k8s/app-deployment.yaml -n devops-copilot --server-side

      - name: Update image to immutable SHA tag and wait for rollout
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${GIT_SHA:0:12}"
          FULL_IMAGE="docker.io/${{ env.DOCKERHUB_USERNAME }}/demo-checkout-service:${IMAGE_TAG}"
          echo "Updating deployment to image: $FULL_IMAGE"
          kubectl set image deployment/demo-checkout-service checkout-api=${FULL_IMAGE} -n devops-copilot

          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/demo-checkout-service -n devops-copilot --timeout=300s

          echo "Verifying rollout: desired / updated / available / ready replicas..."
          kubectl get deployment demo-checkout-service -n devops-copilot -o jsonpath='{.status.replicas}' > /tmp/desired
          kubectl get deployment demo-checkout-service -n devops-copilot -o jsonpath='{.status.updatedReplicas}' > /tmp/updated
          kubectl get deployment demo-checkout-service -n devops-copilot -o jsonpath='{.status.availableReplicas}' > /tmp/available
          kubectl get deployment demo-checkout-service -n devops-copilot -o jsonpath='{.status.readyReplicas}' > /tmp/ready
          DESIRED=$(cat /tmp/desired)
          UPDATED=$(cat /tmp/updated)
          AVAILABLE=$(cat /tmp/available)
          READY=$(cat /tmp/ready)
          echo "Replica counts - desired=${DESIRED} updated=${UPDATED} available=${AVAILABLE} ready=${READY}"
          if [ "${AVAILABLE}" -lt "${DESIRED}" ]; then
            echo "::error::Rollout incomplete: available (${AVAILABLE}) is less than desired (${DESIRED})."
            kubectl get events -n devops-copilot --field-selector type=Warning --sort-by=.lastTimestamp | tail -20 || true
            kubectl get pods -n devops-copilot -o wide || true
            exit 1
          fi
          echo "::notice::Rollout verified successfully: ${AVAILABLE}/${DESIRED} available."

      - name: Surface deployment summary
        run: |
          kubectl get deployments -n devops-copilot -o wide
          echo "Deployment complete for commit: ${{ github.sha }}"

      - name: Verify workload health endpoints through Kubernetes
        run: |
          POD_NAME=$(kubectl get pods -n devops-copilot -l app=demo-checkout-service -o jsonpath='{.items[0].metadata.name}')
          echo "Checking health of pod: $POD_NAME"
          kubectl exec -n devops-copilot $POD_NAME -- wget -qO- http://localhost:3000/health

