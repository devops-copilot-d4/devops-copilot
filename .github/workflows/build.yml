name: Phase 7 CI/CD and Kubernetes Deployment

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: phase7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Test, build, and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Test backend
        run: |
          npm --prefix backend ci
          npm --prefix backend test
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Test AI service and canonical ML pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai-service/requirements.txt
          python -m pytest ai-service/tests ml/tests
      - name: Check patch formatting
        run: git diff --check
      - name: Validate Kubernetes manifests without a cluster
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -summary -ignore-missing-schemas k8s/rbac.yaml k8s/app-deployment.yaml k8s/prometheus/prometheus-config.yaml k8s/prometheus/prometheus-deployment.yaml

  build-images:
    name: Build container images
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - name: Build AI service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ai-service/Dockerfile
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
      - name: Build demo workload image
        uses: docker/build-push-action@v6
        with:
          context: ./sample-app
          push: false

  publish-and-deploy:
    name: Publish images and deploy existing Kubernetes workload
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Require deployment secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          for secret_name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN KUBE_CONFIG; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Required GitHub Actions secret ${secret_name} is not configured."
              exit 1
            fi
          done
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute immutable image tag
        id: image
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-copilot-backend:${{ steps.image.outputs.tag }}
      - name: Build and push AI service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ai-service/Dockerfile
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-copilot-ai:${{ steps.image.outputs.tag }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-copilot-frontend:${{ steps.image.outputs.tag }}
      - name: Build and push demo workload image
        uses: docker/build-push-action@v6
        with:
          context: ./sample-app
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/demo-checkout-service:${{ steps.image.outputs.tag }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Configure Kubernetes credentials
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --request-timeout=15s
      - name: Apply existing Kubernetes manifests
        run: |
          set -euo pipefail
          kubectl apply --server-side -f k8s/rbac.yaml
          kubectl apply --server-side -n devops-copilot -f k8s/prometheus/prometheus-config.yaml
          kubectl apply --server-side -n devops-copilot -f k8s/prometheus/prometheus-deployment.yaml
          kubectl apply --server-side -n devops-copilot -f k8s/app-deployment.yaml
      - name: Deploy immutable demo workload image and verify rollout
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/demo-checkout-service:${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          kubectl set image deployment/demo-checkout-service checkout-api="$IMAGE" -n devops-copilot
          kubectl rollout status deployment/prometheus -n devops-copilot --timeout=300s
          kubectl rollout status deployment/demo-checkout-service -n devops-copilot --timeout=300s
          desired=$(kubectl get deployment demo-checkout-service -n devops-copilot -o jsonpath='{.spec.replicas}')
          updated=$(kubectl get deployment demo-checkout-service -n devops-copilot -o jsonpath='{.status.updatedReplicas}')
          available=$(kubectl get deployment demo-checkout-service -n devops-copilot -o jsonpath='{.status.availableReplicas}')
          ready=$(kubectl get deployment demo-checkout-service -n devops-copilot -o jsonpath='{.status.readyReplicas}')
          echo "desired=${desired} updated=${updated} available=${available} ready=${ready}"
          if [ -z "$desired" ] || [ "$updated" -lt "$desired" ] || [ "$available" -lt "$desired" ] || [ "$ready" -lt "$desired" ]; then
            echo "::error::Kubernetes did not confirm the desired rollout state."
            kubectl get pods -n devops-copilot -o wide || true
            kubectl get events -n devops-copilot --field-selector type=Warning --sort-by=.lastTimestamp | tail -20 || true
            exit 1
          fi
      - name: Verify demo workload health endpoint
        run: |
          set -euo pipefail
          pod=$(kubectl get pods -n devops-copilot -l app=demo-checkout-service -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' | awk '{print $1}')
          if [ -z "$pod" ]; then
            echo "::error::No running demo workload pod was found after rollout."
            exit 1
          fi
          kubectl exec -n devops-copilot "$pod" -- wget -qO- http://localhost:3000/health
